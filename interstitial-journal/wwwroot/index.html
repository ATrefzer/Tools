<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Interstitial Journal</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    /* ── Base colors & variables ───────────────────────────────── */
    :root {
      --bg:        #F9F5EE;
      --paper:     #FFFDF8;
      --ink:       #2C2416;
      --ink-light: #7A6E5F;
      --accent:    #8B5E3C;
      --border:    #E8E0D0;
      --danger:    #C0392B;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Lora', Georgia, serif;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    /* ── Page layout ─────────────────────────────────────────── */
    .page {
      max-width: 640px;
      margin: 0 auto;
    }

    /* ── Header ──────────────────────────────────────────────── */
    header {
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-light);
      font-family: 'JetBrains Mono', monospace;
    }

    /* ── Date navigation ─────────────────────────────────────── */
    .date-bar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .date-btn {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      padding: 0.3rem 0.75rem;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--ink-light);
      cursor: pointer;
      border-radius: 2px;
      transition: all 0.15s;
    }

    .date-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .date-btn.active {
      background: var(--ink);
      color: var(--bg);
      border-color: var(--ink);
    }

    #datePicker {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      padding: 0.3rem 0.5rem;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      border-radius: 2px;
    }

    /* ── Input area ──────────────────────────────────────────── */
    .input-area {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 2rem;
    }

    #textInput {
      flex: 1;
      font-family: 'Lora', serif;
      font-size: 1rem;
      padding: 0.6rem 0.75rem;
      border: none;
      border-bottom: 2px solid var(--border);
      background: transparent;
      color: var(--ink);
      outline: none;
      transition: border-color 0.2s;
    }

    #textInput:focus {
      border-bottom-color: var(--accent);
    }

    #textInput::placeholder {
      color: var(--ink-light);
      font-style: italic;
    }

    #submitBtn {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      padding: 0.6rem 1rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 2px;
      cursor: pointer;
      transition: opacity 0.15s;
      white-space: nowrap;
    }

    #submitBtn:hover { opacity: 0.85; }

    /* ── Entry list ──────────────────────────────────────────── */
    #entries {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .entry {
      display: flex;
      align-items: baseline;
      gap: 1rem;
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--border);
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .entry-time {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--ink-light);
      white-space: nowrap;
      min-width: 4.5rem;
      /* Show time only (not the date, since we filter by day) */
    }

    .entry-text {
      flex: 1;
      font-size: 1rem;
      line-height: 1.6;
    }

    .entry-delete {
      background: none;
      border: none;
      color: var(--border);
      cursor: pointer;
      font-size: 1rem;
      padding: 0 0.25rem;
      line-height: 1;
      transition: color 0.15s;
      visibility: hidden;
    }

    .entry:hover .entry-delete {
      visibility: visible;
    }

    .entry-delete:hover {
      color: var(--danger);
    }

    /* ── Empty state ─────────────────────────────────────────── */
    .empty-state {
      text-align: center;
      color: var(--ink-light);
      font-style: italic;
      padding: 3rem 0;
      font-size: 0.95rem;
    }

    /* ── Counter ─────────────────────────────────────────────── */
    .count {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--ink-light);
      text-align: right;
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="page">

    <header>
      <h1>Interstitial Journal</h1>
    </header>

    <!-- Date navigation -->
    <div class="date-bar">
      <button class="date-btn active" id="btnHeute" onclick="setDay('today')">Today</button>
      <button class="date-btn" id="btnGestern" onclick="setDay('yesterday')">Yesterday</button>
      <input type="date" id="datePicker" onchange="setDay('picker')" />
    </div>

    <!-- Input -->
    <div class="input-area">
      <input
        type="text"
        id="textInput"
        placeholder="What am I doing right now?"
        autocomplete="off"
      />
      <button id="submitBtn" onclick="addEntry()">Now ✦</button>
    </div>

    <!-- Count -->
    <div class="count" id="count"></div>

    <!-- Entries -->
    <div id="entries"></div>

  </div>

  <script>
    // ── Date management ───────────────────────────────────────────

    // Formats a Date object as "yyyy-MM-dd"
    function toISODate(d) {
      return d.toISOString().split('T')[0];
    }

    // Returns the currently selected date (as a yyyy-MM-dd string)
    function getSelectedDate() {
      return document.getElementById('datePicker').value;
    }

    // Sets the active day (today / yesterday / picker)
    function setDay(which) {
      const today     = new Date();
      const yesterday = new Date(today);
      yesterday.setDate(today.getDate() - 1);

      const picker = document.getElementById('datePicker');

      if (which === 'today') {
        picker.value = toISODate(today);
      } else if (which === 'yesterday') {
        picker.value = toISODate(yesterday);
      }
      // 'picker': value was already set by onchange

      // Update active class
      document.getElementById('btnHeute').classList.toggle('active',
        picker.value === toISODate(today));
      document.getElementById('btnGestern').classList.toggle('active',
        picker.value === toISODate(yesterday));

      loadEntries();
    }

    // ── Load entries ──────────────────────────────────────────────

    async function loadEntries() {
      const date = getSelectedDate();
      const response = await fetch(`/api/entries?date=${date}`);
      const entries  = await response.json();

      const container = document.getElementById('entries');
      const countEl   = document.getElementById('count');

      if (entries.length === 0) {
        container.innerHTML = '<div class="empty-state">No entries for this day yet.</div>';
        countEl.textContent = '';
        return;
      }

      countEl.textContent = `${entries.length} entr${entries.length !== 1 ? 'ies' : 'y'}`;

      container.innerHTML = entries.map(e => `
        <div class="entry" id="entry-${e.id}">
          <span class="entry-time">${e.timestamp.split(' ')[1]}</span>
          <span class="entry-text">${escapeHtml(e.text)}</span>
          <button class="entry-delete" onclick="deleteEntry('${e.id}')" title="Delete">×</button>
        </div>
      `).join('');
    }

    // ── Add entry ─────────────────────────────────────────────────

    async function addEntry() {
      const input = document.getElementById('textInput');
      const text  = input.value.trim();

      if (!text) {
        input.focus();
        return;
      }

      await fetch('/api/entries', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ text })
      });

      input.value = '';

      // Make sure we're on "Today" so the new entry is visible
      setDay('today');
    }

    // ── Delete entry ──────────────────────────────────────────────

    async function deleteEntry(id) {
      await fetch(`/api/entries/${id}`, { method: 'DELETE' });
      loadEntries();
    }

    // ── Enter key = submit ────────────────────────────────────────

    document.getElementById('textInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') addEntry();
    });

    // ── Helper: escape HTML special characters ────────────────────

    function escapeHtml(text) {
      return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // ── On load: show today ───────────────────────────────────────

    setDay('today');
  </script>
</body>
</html>
